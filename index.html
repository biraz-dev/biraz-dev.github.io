<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>biraz.dev</title>
  <meta name="description" content="Sojourn, Jig and The Arena.">
  <style>
    :root { color-scheme: light dark; --text: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --bg: #fbfbfa; }
    @media (prefers-color-scheme: dark) { :root { --text: #ececec; --muted: #9a9a9f; --line: #3a3a3c; --bg: #161617; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(420px, calc(100% - 32px)); }
    h1 { font-weight: 500; font-size: 1.1rem; letter-spacing: .02em; color: var(--muted); margin: 0 0 1.5rem; }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    li { border-bottom: 1px solid var(--line); }
    a { display: block; padding: 1rem 0; color: inherit; text-decoration: none; font-size: 1.4rem; }
    a:hover, a:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>biraz.dev</h1>
    <ul>
      <li><a href="/Sojourn/">Sojourn</a></li>
      <li><a href="/Jig/">Jig</a></li>
      <li><a href="/The-Arena/">The Arena</a></li>
    </ul>
  </main>
</body>
</html>
